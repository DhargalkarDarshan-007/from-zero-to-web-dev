<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>
    <style>
        * {
            margin: 0;
            padding: 0;

        }

        body {
            background-color: rgb(170, 166, 166);
        }

        .box {
            background-color: white;
            border: 0.1px solid rgb(215, 211, 211);
            border-radius: 25px;
            margin-top: 90px;
            margin-left: 600px;
            /* margin-left:444px; */
            width: 344px;
            height: 79vh;
            /* box-shadow: 0px 0px 10px 0px rgb(215, 211, 211); */
        }

        .img img {
            padding: 12px;
            border-radius: 30px;
            height: 30vh;
        }

        .a {
            padding: 17px 30px;
        }

        .a span {
            font-size: 15px;
            font-weight: 100;
            color: rgb(120, 118, 118);
            margin-right: 10px;
            border: 0.1px solid rgb(233, 232, 232);
            border-radius: 10px;
            padding: 2px 10px;
            box-shadow: 0px 0px 10px 0px rgb(223, 220, 220);
        }

        .heading h2 {
            padding: 10px 22px;
        }
        .contain {
            padding: 10px 22px;
            font-size: 15px;
            color: rgb(91, 89, 89);
        }
        .btn {
            padding: 20px 120px;
        }
        .btn button {
            background-color: rgb(204, 218, 239);
            color: rgb(7, 19, 251);
            padding: 15px 19px;
            border-radius: 30px;
            border: none;
            text-shadow: 0px 0px 10px rgb(20, 27, 165);
        }
        .btn button:hover {
            background-color: rgb(15, 15, 23);
            color: white;
            transition: 0.5s;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="box">
        <div class="img">
            <img width="320px"
                src="https://images.unsplash.com/photo-1520209759809-a9bcb6cb3241?q=80&w=2070&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                alt="card img">
        </div>
        <div class="a">
            <span>Nature</span>
            <span>Lake</span>
        </div>
        <div class="heading">
            <h2> Darshan Dhargalkar</h2>
        </div>
        <div class="contain">
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Iusto voluptatibus at vel laborum porro error non magnam voluptate eaque animi, expedita enim laudantium. Fugit iste corrupti nisi explicabo molestiae, odio asperiores excepturi sapiente rem culpa!
        </div>
        <div class="btn">
            <button>Read More</button>
        </div>
    </div>

</body>

</html>
