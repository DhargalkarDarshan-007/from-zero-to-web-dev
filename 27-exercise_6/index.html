    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .logo img {
            width: 140px;
            margin-left: 145px;
        }

        nav {
            display: flex;
            justify-content: space-around;
            margin: 20px -70px;
            /* align-items: center; */

        }

        .right ul {
            list-style: none;
            gap: 25px;
            display: flex;
            margin-left: 340px;
        }

        .right ul li {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 19px;
            font-weight: 600;
            color: #141B34;
            cursor: pointer;
            border: #fbfcff 0.2px solid;
            border-radius: 20px;
            padding: 1px 15px;

        }

        .right li:hover {
            border: 0.2px solid rgb(89, 88, 88);
            box-shadow: 0px 0px 5px 0px rgb(89, 88, 88);
        }

        .contain {

            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            font-size: 40px;
            margin-top: 80px;
        }

        .contain i {
            width: 20px;
        }

        .para h3:first-child {
            margin-bottom: -18px;
            margin-top: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: rgb(91, 89, 89);
        }

        .para h3 {
            display: flex;
            justify-content: center;
            align-items: center;
            color: rgb(91, 89, 89);
        }


        .para {
            gap: 10px;
        }

        .button {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 40px;
        }

        .button button {
            background-color: #007BFF;
            color: white;
            padding: 15px 20px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }

        .button button:hover {
            box-shadow: #141B34 0px 0px 10px 1px;
        }

        .foot {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: 300px;
            margin-top: 80px;
        }

        .icon {
            background-color: rgb(212, 212, 27);
            width: 40px;
            height: 40px;
            border-radius: 50%;
        }

        .foot h5 {
            margin-top: 15px;
            margin-left: -7px;
        }
    </style>
</head>
