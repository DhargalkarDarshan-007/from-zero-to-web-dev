<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        ul li {
            color: rgb(0, 7, 109);
            list-style: none;
            display: inline;
            padding: 5px;
            margin: 10px;
            font-size: 20px;
            font-weight: 600;
            border: 0.2px solid rgba(0, 0, 0, 0.484);
            border-radius: 20px;

        }

        ul li:hover {
            box-shadow: 0px 0px 10px 1px rgba(32, 0, 84, 0.479);
            /* color: white; */
        }
        header {
            position: sticky;
            top: 0;
        }

        nav {
            background-color: rgb(104, 50, 252);
            padding: 30px;
            
        }
       
        .container {
            margin: 20px;
            height: 80vh;
            background-color: rgb(105, 89, 247);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container .box {
            width: 40vw;
            height: 60vh;
            background-color: rgb(139, 147, 248);
            margin: 30px;
            padding: 20px;
        }

        .info {
            margin-left: 75px;
            height: 20vh;
            width: 80vw;
            background-color: rgb(97, 81, 212);
            border-radius: 55px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .info h1 {
            padding: 20px;
            color: white;
        }

        .logo i {
            position: absolute;
            top: 590px;
            right: 30px;
            background-color: rgb(4, 0, 16);
            padding: 20px;
            border-radius: 50%;
            position: fixed;
        }

        .foot {
            height: 10vh;
            width: 100vw;
            margin-top: 20px;
            background-color: rgb(104, 50, 252);
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <ul>
                <li>Home</li>
                <li>About</li>
                <li>Services</li>
                <li>Contact</li>
            </ul>
        </nav>

    </header>
    <div class="container">
        <div class="box box1"></div>
        <div class="box box2"></div>
    </div>
    <div class="logo">
        <i class="fa-solid fa-microphone-slash" style="font-size: 30px; color: red;"></i>
    </div>
    <div class="info">
        <h1>Welcome to this Sigma web Development Express</h1>
    </div>
    <footer>
        <div class="foot">
            <h3>© 2026 Sigma Web Development Express. All Rights Reserved.
                Empowering the next generation of web developers. 🚀</h3>

        </div>
    </footer>


</body>

</html>
