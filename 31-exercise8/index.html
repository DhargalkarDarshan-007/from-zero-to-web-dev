<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: blue;
        }
        .box {
            height: 121px;
            width: 121px;
            background-color: red;
            border-radius: 70px;
            position: absolute;
            bottom: 0;
            left: 0;
            /* animation: name duration timing-function delay iteration-count direction fill-mode; */

            animation:
             xAxisAnimation 3s linear infinite,
                YAxisAnimation 1s ease-out infinite alternate;
        }

        .container {
            position: relative;
            height: 90vh;
            width: 90vw;
            background-color: blue;
        }

        @keyframes YAxisAnimation {
            from {
                bottom: 0;
            }

            to {
                bottom:70%;
            }
        }

        @keyframes xAxisAnimation {
            from {
                left: 0;
            }

            to {
                left: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <div class="box">
        </div>
    </div>
    <!-- 
   
     -->
</body>

</html>
