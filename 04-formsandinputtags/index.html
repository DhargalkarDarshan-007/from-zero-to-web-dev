<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms - Lets learn it</title>
</head>

<body>
    <h1>Form to apply for Sigma Web Development course - TA </h1>
    <form action="post">
        <div>
            <label for="username">Enter your username</label>
            <input type="text" id="username" name="username" placeholder="Enter your username">
        </div>
        <div>
            <input type="radio" id="male" name="gender" value="">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender">
            <label for="female">Female</label>
        </div>
        <div>
            <input type="checkbox" id="sub" name="sub" value="yes">
            <label for="sub">Subscribe</label>
        </div>
        <div>
            <label for="comment">Enter your comments</label><br>
            <textarea name="comment" id="comment" rows="4" cols="50" placeholder="Enter your comments"></textarea>
        </div>
        <div>
            <select name="fruits" id="">
                <option value="apple">Apple</option>
                <option value="banana">Banana</option>
                <option value="Cherry">Cherry</option>
            </select>
        </div>

    </form>

</body>

</html>
